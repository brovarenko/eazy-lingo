name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Generate Prisma client
        run: pnpm generate

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm --recursive build

      - name: Prepare environment files
        run: |
          cat <<'EOF' > server/.env
          JWT_SECRET=test-secret
          JWT_REFRESH_SECRET=test-refresh
          GOOGLE_CLIENT_ID=dummy-client-id
          GOOGLE_CLIENT_SECRET=dummy-client-secret
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/callback
          EOF
          cat <<'EOF' > client/.env
          NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api
          EOF

      - name: Build images
        run: docker compose -f docker-compose.dev.yml build

      - name: Start database only
        id: compose_up
        run: docker compose -f docker-compose.dev.yml up -d db

      - name: Preinstall server deps (populate volume)
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps server sh -lc "pnpm install --filter @eazy-lingo/server --frozen-lockfile"

      - name: Preinstall client deps (populate volume)
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps client sh -lc "pnpm install --filter @eazy-lingo/client --frozen-lockfile"

      - name: Start services
        run: docker compose -f docker-compose.dev.yml up -d server client

      - name: Wait for services (with retries)
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1"; local name="$2"; local max_attempts=${3:-60}; local delay=${4:-2}
            echo "Waiting for $name at $url ..."
            for i in $(seq 1 "$max_attempts"); do
              if curl -fsS -L --retry 2 --retry-connrefused --max-time 5 "$url" > /dev/null; then
                echo "$name is up (attempt $i)."; return 0
              fi
              sleep "$delay"
            done
            echo "Timed out waiting for $name at $url after $((max_attempts*delay))s" >&2
            echo "--- docker compose ps ---" >&2
            docker compose -f docker-compose.dev.yml ps >&2 || true
            echo "--- recent logs ---" >&2
            docker compose -f docker-compose.dev.yml logs --no-color --tail=200 >&2 || true
            exit 1
          }
          wait_for http://localhost:4000/api/health "API" 120 2
          wait_for http://localhost:3000 "Client" 120 2

      - name: Tear down docker-compose stack
        if: always() && steps.compose_up.outcome == 'success'
        run: docker compose -f docker-compose.dev.yml down
