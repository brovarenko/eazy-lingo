name: Deploy to EC2

on:
  workflow_run:
    workflows: ['Publish Docker Images']
    types: [completed]

jobs:
  deploy:
    environment: EC2_HOST
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -Eeuo pipefail
            cd /opt/eazy-lingo

            if [ ! -f .env.production ]; then
              echo "::error::Missing /opt/eazy-lingo/.env.production. Copy .env.production.example and fill in secrets before deploying."
              exit 1
            fi

            COMPOSE_CMD="docker compose --env-file .env.production -f docker-compose.prod.yml"

            echo "===> Logging in to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_OWNER
            echo "Using ghcr.io/$IMAGE_OWNER/*:latest"

            echo "===> Removing old images"
            docker image rm ghcr.io/$IMAGE_OWNER/eazy-lingo-server:latest -f || true
            docker image rm ghcr.io/$IMAGE_OWNER/eazy-lingo-client:latest -f || true

            echo "===> Pulling new images"
            $COMPOSE_CMD pull

            echo "===> Restarting stack"
            $COMPOSE_CMD down
            $COMPOSE_CMD up -d

            echo "===> Cleaning up"
            docker system prune -f

            echo "===> Current containers:"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

            echo "===> Deployed image digests:"
            docker inspect eazy-lingo-server-1 | grep Image
            docker inspect eazy-lingo-client-1 | grep Image
