services:
  db:
    image: postgres:15-alpine
    container_name: eazy_lingo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eazy_lingo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: eazy-lingo-server:dev
    build:
      context: ./server
      target: dev
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eazy_lingo
    ports:
      - '4000:4000'
      - '5555:5555'
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "pnpm prisma migrate deploy && pnpm run start:dev"

  client:
    image: eazy-lingo-client:dev
    build:
      context: ./client
      target: dev
    env_file:
      - client/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      - server

volumes:
  pgdata:
  server_node_modules:
  client_node_modules:
  client_next:
