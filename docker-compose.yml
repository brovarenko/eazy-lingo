services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eazy_lingo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: eazy-lingo-server:prod
    build:
      context: ./server
      target: prod
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eazy_lingo
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "pnpm prisma migrate deploy && node dist/main.js"

  client:
    image: eazy-lingo-client:prod
    build:
      context: ./client
      target: prod
    env_file:
      - client/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://server:4000/api
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - "3000:3000"
    command: ["pnpm", "start"]

volumes:
  pgdata:
