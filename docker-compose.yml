services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eazy_lingo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: eazy-lingo-server:prod
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eazy_lingo
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      CLIENT_APP_URL: ${CLIENT_APP_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "pnpm --filter @eazy-lingo/server exec prisma migrate deploy &&
             node server/dist/prisma/seed.js &&
             node server/dist/src/main.js"

  client:
    image: eazy-lingo-client:prod
    build:
      context: .
      dockerfile: client/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - '3000:3000'
    command: ['pnpm', '--filter', '@eazy-lingo/client', 'start']

volumes:
  pgdata:
